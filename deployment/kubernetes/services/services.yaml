apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-city
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-service
  namespace: smart-city
spec:
  type: ClusterIP
  selector:
    app: traffic-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
