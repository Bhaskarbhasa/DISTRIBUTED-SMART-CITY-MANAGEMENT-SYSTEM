apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-service
  namespace: smart-city
spec:
  replicas: 3
  selector:
    matchLabels:
      app: traffic-service
  template:
    metadata:
      labels:
        app: traffic-service
    spec:
      containers:
      - name: traffic-service
        image: traffic-service:latest
