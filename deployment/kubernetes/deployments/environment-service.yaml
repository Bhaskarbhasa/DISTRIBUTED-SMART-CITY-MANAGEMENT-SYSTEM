apiVersion: apps/v1
kind: Deployment
metadata:
  name: environment-service
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels:
      app: environment-service
  template:
    metadata:
      labels:
        app: environment-service
    spec:
      containers:
      - name: environment-service
        image: environment-service:latest
