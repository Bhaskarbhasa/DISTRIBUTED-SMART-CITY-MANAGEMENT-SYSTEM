groups:
  - name: smartcity_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighKafkaLag
        expr: kafka_consumergroup_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka Consumer Lag"
          description: "Kafka consumer lag is > 1000 for 5m. Current value: {{ $value }}"

      - alert: FogNodeDown
        expr: up{job="fog-nodes"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Fog Node {{ $labels.instance }} is down"
          description: "A fog node went down, Raft election may be triggered."

      - alert: HighTrafficCongestion
        expr: smartcity_traffic_congestion_level > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Traffic Congestion Detected"
          description: "Traffic congestion level is above 85%. Current value: {{ $value }}"

      - alert: EmergencyAlert
        expr: smartcity_emergency_active > 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Active Emergency Alert"
          description: "An emergency event is currently active in the smart city system."
