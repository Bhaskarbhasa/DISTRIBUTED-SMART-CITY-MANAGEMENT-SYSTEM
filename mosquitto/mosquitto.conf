# mosquitto.conf

# Listener on port 1883 for MQTT protocol
listener 1883
protocol mqtt

# Listener on port 9001 for WebSockets
listener 9001
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Allow anonymous access (for development/testing only)
allow_anonymous true
